<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: a wide child of an element that fits</title>
    <style>
      /* The parent ends at 400px and its child at 1640px. */
      html,
      body {
        margin: 0;
      }
      div {
        height: 30px;
      }
      #parent {
        width: 400px;
      }
      #child {
        width: 1640px;
      }
    </style>
  </head>
  <body>
    <div id="parent"><div id="child"></div></div>
  </body>
</html>
