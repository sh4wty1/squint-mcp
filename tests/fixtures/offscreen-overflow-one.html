<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: an element as wide as one viewport and one pixel wider than another</title>
    <style>
      /* The page is 400px wide at 399x300 and at 400x300. */
      html,
      body {
        margin: 0;
      }
      #box {
        width: 400px;
        height: 20px;
        background: rgb(200, 200, 200);
      }
    </style>
  </head>
  <body>
    <div id="box"></div>
  </body>
</html>
