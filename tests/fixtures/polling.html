<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: never network-idle</title>
  </head>
  <body>
    <div id="probe" style="width: 50px; height: 50px; background: rgb(0, 0, 0)"></div>
    <script>
      // A request every 100ms: the network is never idle for the 500ms `networkidle` needs.
      setInterval(() => fetch("/tick"), 100);
    </script>
  </body>
</html>
