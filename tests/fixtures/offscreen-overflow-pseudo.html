<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: a page widened by a pseudo-element</title>
    <style>
      /* At 400x300 the page is 600px wide, and no element ends past 400px. */
      html,
      body {
        margin: 0;
      }
      #host::after {
        content: "";
        display: block;
        width: 600px;
        height: 20px;
        background: rgb(200, 200, 200);
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
  </body>
</html>
