<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: the bounds of a font that did not load</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink, so 10 glyphs at 20px are 200px wide.
         `Wide` is Ahem half as large again: a glyph is 30px wide. Both load. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      @font-face {
        font-family: Wide;
        src: url("Ahem.ttf");
        size-adjust: 150%;
      }
      /* One family per rule. A `src` that starts with `no-such-` names no file. */
      /* A Face that loads and one that does not, by weight. */
      @font-face {
        font-family: Half;
        font-weight: 400;
        src: url("Ahem.ttf");
      }
      @font-face {
        font-family: Half;
        font-weight: 700;
        src: url("no-such-half-bold.woff2");
      }
      /* A Face that loads and one that does not, by `unicode-range`: capitals
         load, small letters do not. */
      @font-face {
        font-family: Mixed;
        src: url("Ahem.ttf");
        unicode-range: U+0041-005A;
      }
      @font-face {
        font-family: Mixed;
        src: url("no-such-mixed-lower.woff2");
        unicode-range: U+0061-007A;
      }
      /* Capitals only, and no text of the page has one in it: never asked for. */
      @font-face {
        font-family: "Upper Only";
        src: url("no-such-upper-only.woff2");
        unicode-range: U+0041-005A;
      }
      @font-face {
        font-family: "Missing Brand";
        src: url("no-such-missing-brand.woff2");
      }
      @font-face {
        font-family: "Veiled Brand";
        src: url("no-such-veiled-brand.woff2");
      }
      @font-face {
        font-family: "Unshown Brand";
        src: url("no-such-unshown-brand.woff2");
      }
      @font-face {
        font-family: "Parent Brand";
        src: url("no-such-parent-brand.woff2");
      }
      @font-face {
        font-family: "Child Brand";
        src: url("no-such-child-brand.woff2");
      }
      @font-face {
        font-family: "Long Brand";
        src: url("no-such-long-brand.woff2");
      }
      @font-face {
        font-family: "Split Brand";
        src: url("no-such-split-brand.woff2");
      }
      /* Both Faces fail. */
      @font-face {
        font-family: Twice;
        font-weight: 400;
        src: url("no-such-twice-normal.woff2");
      }
      @font-face {
        font-family: Twice;
        font-weight: 700;
        src: url("no-such-twice-bold.woff2");
      }
      /* Declared by the document, asked for from inside a shadow tree. */
      @font-face {
        font-family: "Shadow Brand";
        src: url("no-such-shadow-brand.woff2");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        font: 20px/30px Ahem;
      }
      .text {
        margin: 20px 0 0 40px;
        width: 200px;
      }

      /* `Half`: the Face of weight 400 loaded, so text of that weight is in the
         font it asks for: 200px on one line, 300px in its Tail. */
      #half-normal,
      #wrapped,
      #half-bold {
        font-family: Half, Wide;
      }
      #half-normal,
      #wrapped {
        font-weight: 400;
      }
      /* Three words of `Half` to a line, or two of `Wide`: justified, its lines
         are 300px wide in both. Only on one line do the two differ. */
      #wrapped {
        width: 300px;
        text-align: justify;
      }
      /* The Face it asks for failed: it is in `Wide`, 300px. */
      #half-bold {
        font-weight: 700;
      }

      /* `Mixed`: 100px of `Mixed` and 150px of `Wide`, against 300px in its Tail. */
      #mixed-both,
      #mixed-lower {
        font-family: Mixed, Wide;
      }

      /* Rendered in its Tail, by a family none of whose Faces failed. */
      #out-of-range {
        font-family: "Upper Only", Ahem;
      }

      /* One family, written in two cases. */
      #lower {
        font-family: missing brand, Ahem;
      }
      #quoted {
        font-family: "Missing Brand", Ahem;
      }

      /* Its Face is built by the script at the end of the page. */
      #scripted {
        font-family: Scripted, Ahem;
      }

      /* Hidden on purpose, before the first element that is seen. */
      #veiled,
      #seen {
        font-family: "Veiled Brand", Ahem;
      }
      #veiled {
        visibility: hidden;
      }

      /* Not rendered, before the first element that is. */
      #unshown,
      #shown {
        font-family: "Unshown Brand", Ahem;
      }
      #unshown {
        display: none;
      }

      /* A parent is judged on its own text: 100px, not the 200px of its line. The
         second parent has none. */
      #own-parent,
      #bare-parent {
        font-family: "Parent Brand", Ahem;
      }
      #own-child,
      #bare-child {
        font-family: Ahem;
      }

      /* A child falls back; its parent is in the font it asks for. */
      #clean-parent {
        font-family: Ahem;
      }
      #fallen-child {
        font-family: "Child Brand", Ahem;
      }

      /* Three lines on the page, 280px on one. */
      #long {
        width: 100px;
        font-family: "Long Brand", Ahem;
      }

      /* Two text nodes, 60px and 80px, around a child in another font. */
      #split {
        font-family: "Split Brand", Ahem;
      }
      #split-child {
        font-family: Ahem;
      }

      /* Each asks for another Face of `Twice`. */
      #twice-normal,
      #twice-bold {
        font-family: Twice, Ahem;
      }
      #twice-bold {
        font-weight: 700;
      }

      #after-host {
        font-family: "Shadow Brand", Ahem;
      }
    </style>
  </head>
  <body>
    <div id="half-normal" class="text">XXXXXXXXXX</div>
    <div id="wrapped" class="text">
      XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX
    </div>
    <div id="half-bold" class="text">XXXXXXXXXX</div>
    <div id="mixed-both" class="text">XXXXXxxxxx</div>
    <div id="mixed-lower" class="text">xxxxxxxxxx</div>
    <div id="out-of-range" class="text">xxxxxxxxxx</div>
    <div id="lower" class="text">XXXXXXXXXX</div>
    <div id="quoted" class="text">XXXXXXXXXX</div>
    <div id="scripted" class="text">XXXXXXXXXX</div>
    <div id="veiled" class="text">XXXXXXXXXX</div>
    <div id="seen" class="text">XXXXXXXXXX</div>
    <div id="unshown" class="text">XXXXXXXXXX</div>
    <div id="shown" class="text">XXXXXXXXXX</div>
    <div id="own-parent" class="text">XXXXX<span id="own-child">XXXXX</span></div>
    <div id="bare-parent" class="text"><span id="bare-child">XXXXX</span></div>
    <div id="clean-parent" class="text">XXXXX<span id="fallen-child">XXXXX</span></div>
    <div id="long" class="text">XXXX XXXX XXXX</div>
    <div id="split" class="text">XXX<span id="split-child">XX</span>XXXX</div>
    <div id="twice-normal" class="text">XXXXXXXXXX</div>
    <div id="twice-bold" class="text">XXXXXXXXXX</div>
    <div id="host"></div>
    <div id="after-host" class="text">XXXXXXXXXX</div>
    <script>
      // A Face no `@font-face` rule declares: a script adds it and loads it, and
      // it fails.
      const scripted = new FontFace("Scripted", 'url("no-such-scripted.woff2")');
      document.fonts.add(scripted);
      scripted.load().catch(() => {});
      // A style does not cross into a shadow tree, so the text carries its own.
      document.getElementById("host").attachShadow({ mode: "open" }).innerHTML =
        `<div data-testid="shadow-text" style="margin: 20px 0 0 40px; width: 200px;` +
        ` font-family: 'Shadow Brand', Ahem">XXXXXXXXXX</div>`;
    </script>
  </body>
</html>
