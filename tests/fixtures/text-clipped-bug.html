<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: clipped text</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink, so 10 glyphs at 20px are 200px wide.
         The 30px line leaves 5px of page background above and below them. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        font: 20px/30px Ahem;
      }
      .clipped {
        margin: 20px 0 0 40px;
        width: 150px;
        overflow-x: hidden;
        white-space: nowrap;
      }
      /* Cut by 4px. */
      #badge {
        margin-top: 40px;
        width: 196px;
      }
      /* Border box: 40,120 150x30. Cut by 50px. */
      h1.clipped {
        margin-top: 50px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="badge" class="clipped">XXXXXXXXXX</div>
    <h1 data-testid="hero-title" class="clipped">XXXXXXXXXX</h1>
  </body>
</html>
