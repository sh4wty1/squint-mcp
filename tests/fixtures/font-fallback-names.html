<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: the names of a font that did not load</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink, so 10 glyphs at 20px are 200px wide.
         It loads. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      /* One family per rule. A `src` that starts with `no-such-` names no file. The
         Faces, read from `document.fonts` in Chromium 153 on Windows and on Linux
         when this fixture was written (the tool does not show them): Ahem is
         `loaded` and the other four are `error`, under the names Dual, DUAL,
         Acme, Inc and Vinyl 12" in this order, each without quotes. Back\slash,
         "Quoted" and 'Single', added later (issue #20), are `error` too, after
         them in this order, with no quotes put around them: one backslash, the
         quotation marks and the apostrophes are part of each name. Read on Windows,
         and the first two on Linux as well by the fourth validation pass.
         FNT-66 and FNT-67, read on Windows in Chromium 153 on 2026-10-16:
         the last three Faces are `error`, named " Two  Spaces ", U+00A0 + NBSP,
         and Tab + U+0009 + Name. Their computed `font-family` values are
         `" Two  Spaces ", Ahem`, U+00A0 + `NBSP, Ahem` (no quotes), and
         `"Tab\9 Name", Ahem`. ASCII edge and doubled spaces, the leading
         U+00A0, and the tab in the Face name are preserved by Chromium.
         These three were not read in the Playwright Linux image. */
      /* One family whose two Faces write its name in two cases. Both fail. */
      @font-face {
        font-family: Dual;
        font-weight: 400;
        src: url("no-such-dual-normal.woff2");
      }
      @font-face {
        font-family: DUAL;
        font-weight: 700;
        src: url("no-such-dual-bold.woff2");
      }
      /* A name with a comma in it. */
      @font-face {
        font-family: "Acme, Inc";
        src: url("no-such-acme-inc.woff2");
      }
      /* A name with a quotation mark in it. The computed `font-family` of `#inch`
         writes it with a backslash: "Vinyl 12\"", Ahem. */
      @font-face {
        font-family: 'Vinyl 12"';
        src: url("no-such-vinyl.woff2");
      }
      /* A name with a backslash in it (FNT-63). The computed `font-family` of
         `#slash` writes it with a second one: "Back\\slash", Ahem. */
      @font-face {
        font-family: "Back\\slash";
        src: url("no-such-back-slash.woff2");
      }
      /* A name that starts and ends with a quotation mark (FNT-64): the marks are
         part of the name. Read on Windows, its Face is `error`, last, under the
         name "Quoted" with its marks, and the computed `font-family` of `#quoted`
         is "\"Quoted\"", Ahem. */
      @font-face {
        font-family: '"Quoted"';
        src: url("no-such-quoted.woff2");
      }
      /* A name that starts and ends with an apostrophe (FNT-65): the apostrophes
         are part of the name. Read on Windows, its Face is `error`, last, under the
         name 'Single' with its apostrophes, and the computed `font-family` of
         `#single` is "'Single'", Ahem. */
      @font-face {
        font-family: "'Single'";
        src: url("no-such-single.woff2");
      }
      /* Whitespace belongs to the name, including its edges (FNT-66). */
      @font-face {
        font-family: " Two  Spaces ";
        src: url("no-such-spaced-name.woff2");
      }
      @font-face {
        font-family: "\a0 NBSP";
        src: url("no-such-nbsp-name.woff2");
      }
      /* The tab is serialized as a hexadecimal escape (FNT-67). */
      @font-face {
        font-family: "Tab\9 Name";
        src: url("no-such-tab-name.woff2");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        font: 20px/30px Ahem;
      }
      .text {
        margin: 20px 0 0 40px;
        width: 200px;
      }

      /* Each asks for another Face of the one family. */
      #dual-normal,
      #dual-bold {
        font-family: Dual, Ahem;
      }
      #dual-bold {
        font-weight: 700;
      }

      #comma {
        font-family: "Acme, Inc", Ahem;
      }

      #inch {
        font-family: 'Vinyl 12"', Ahem;
      }

      #slash {
        font-family: "Back\\slash", Ahem;
      }

      #quoted {
        font-family: '"Quoted"', Ahem;
      }

      #single {
        font-family: "'Single'", Ahem;
      }

      #spaced-name {
        font-family: " Two  Spaces ", Ahem;
      }

      #nbsp-name {
        font-family: "\a0 NBSP", Ahem;
      }

      #tab-name {
        font-family: "Tab\9 Name", Ahem;
      }
    </style>
  </head>
  <body>
    <div id="dual-normal" class="text">XXXXXXXXXX</div>
    <div id="dual-bold" class="text">XXXXXXXXXX</div>
    <div id="comma" class="text">XXXXXXXXXX</div>
    <div id="inch" class="text">XXXXXXXXXX</div>
    <div id="slash" class="text">XXXXXXXXXX</div>
    <div id="quoted" class="text">XXXXXXXXXX</div>
    <div id="single" class="text">XXXXXXXXXX</div>
    <div id="spaced-name" class="text">XXXXXXXXXX</div>
    <div id="nbsp-name" class="text">XXXXXXXXXX</div>
    <div id="tab-name" class="text">XXXXXXXXXX</div>
  </body>
</html>
