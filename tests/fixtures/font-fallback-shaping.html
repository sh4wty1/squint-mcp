<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: the styles that shape a text in a font that did not load</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink, so 10 glyphs at 20px are 200px wide.
         `Wide` is Ahem half as large again: a glyph is 30px wide. Both load. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      @font-face {
        font-family: Wide;
        src: url("Ahem.ttf");
        size-adjust: 150%;
      }
      /* One family per rule. A `src` that starts with `no-such-` names no file. */
      /* A Face that loads and one that does not, by `unicode-range`: capitals
         load, small letters do not. */
      @font-face {
        font-family: Mixed;
        src: url("Ahem.ttf");
        unicode-range: U+0041-005A;
      }
      @font-face {
        font-family: Mixed;
        src: url("no-such-mixed-lower.woff2");
        unicode-range: U+0061-007A;
      }
      /* A Face that loads and one that does not, by style. */
      @font-face {
        font-family: Slant;
        font-style: normal;
        src: url("Ahem.ttf");
      }
      @font-face {
        font-family: Slant;
        font-style: italic;
        src: url("no-such-slant-italic.woff2");
      }
      @font-face {
        font-family: "Spaced Brand";
        src: url("no-such-spaced-brand.woff2");
      }
      @font-face {
        font-family: "Turned Brand";
        src: url("no-such-turned-brand.woff2");
      }
      @font-face {
        font-family: "Swift Brand";
        src: url("no-such-swift-brand.woff2");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        font: 20px/30px Ahem;
      }
      .text {
        margin: 20px 0 0 40px;
        width: 200px;
      }

      /* `Mixed`: small letters are in `Wide`, 300px, as in their Tail. */
      #upper-mixed,
      #lower-mixed {
        font-family: Mixed, Wide;
      }
      /* Written in small letters and painted in capitals, which loaded: 200px. */
      #upper-mixed {
        text-transform: uppercase;
      }

      /* `Slant`: upright text is in the font it asks for, 200px; italic text
         asks for the Face that failed and is in `Wide`, 300px. */
      #slant-normal,
      #slant-italic {
        font-family: Slant, Wide;
      }
      #slant-italic {
        font-style: italic;
      }

      /* Nine glyphs and a space of 20px, 2px after each of the ten characters
         and 6px at the space: 226px on one line. */
      #spaced {
        font-family: "Spaced Brand", Ahem;
        letter-spacing: 2px;
        word-spacing: 6px;
      }

      /* The two cases below are in fonts of the machine, so no test gives their
         width as a figure: it is that of the box of the element. */

      /* A block of its own that runs from right to left, in the font the machine
         has for `serif`. The full stop at its end takes the direction of the block:
         it goes to the left of the letters, apart from the `Y` it is kerned with on
         a line that runs from left to right, and the text is wider for it (55.39px
         against 52.81px, in Times New Roman on Windows and in Liberation Serif on
         Linux). */
      #turned {
        display: inline-block;
        direction: rtl;
        font-family: "Turned Brand", serif;
      }

      /* `optimizeSpeed` sets a text without its ligatures, and no generic family
         gives a font that has any: Calibri is a font of Windows and FreeSerif one
         of Linux, and `fi` and `ffi` are ligatures in both. The text is wider
         without them (113.84px against 112.69px in Calibri, 117.48px against
         110.06px in FreeSerif). */
      #swift {
        font-family: "Swift Brand", Calibri, FreeSerif;
        text-rendering: optimizeSpeed;
      }
    </style>
  </head>
  <body>
    <div id="upper-mixed" class="text">xxxxxxxxxx</div>
    <div id="lower-mixed" class="text">xxxxxxxxxx</div>
    <div id="slant-normal" class="text">XXXXXXXXXX</div>
    <div id="slant-italic" class="text">XXXXXXXXXX</div>
    <div class="text"><span id="spaced">XXXX XXXXX</span></div>
    <div class="text"><span id="turned">PLAY.</span></div>
    <div class="text"><span id="swift">fifth office file</span></div>
  </body>
</html>
