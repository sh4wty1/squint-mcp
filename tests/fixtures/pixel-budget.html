<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: many texts that cost the most to count</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
      }
      /* 14,400,000 pixels, each of its own colour: the most a count can cost. */
      #noise {
        display: block;
      }
      /* 55 texts over the noise, painted only when the URL targets them. Each is
         one line of 1440x180: 259,200 pixels, under what is counted, and
         14,256,000 together. Grey, so that every one is too close to the noise
         behind a tenth of it. */
      #texts:not(:target) {
        display: none;
      }
      #texts div {
        position: absolute;
        left: 0;
        font: 180px/1 Ahem;
        color: rgb(128, 128, 128);
      }
      /* 100x40 on the white under the noise: 2.84:1. */
      #small {
        position: absolute;
        top: 10100px;
        left: 0;
        font: 40px/1 Ahem;
        letter-spacing: 10px;
        color: rgb(153, 153, 153);
      }
    </style>
  </head>
  <body>
    <canvas id="noise" width="1440" height="10000"></canvas>
    <div id="texts"></div>
    <div id="small">XX</div>
    <script>
      // Pixel i is painted in colour i, opaque: no two pixels share a colour, and
      // the page still compresses well, so capturing it stays quick.
      const context = document.getElementById("noise").getContext("2d");
      const image = context.createImageData(1440, 10000);
      const colors = new Uint32Array(image.data.buffer);
      for (let i = 0; i < colors.length; i++) colors[i] = 0xff000000 | i;
      context.putImageData(image, 0, 0);
      // Eight glyphs fill a line.
      for (let i = 0; i < 55; i++) {
        const text = document.createElement("div");
        text.id = `text-${i}`;
        text.style.top = `${i * 180}px`;
        text.textContent = "XXXXXXXX";
        document.getElementById("texts").append(text);
      }
    </script>
  </body>
</html>
