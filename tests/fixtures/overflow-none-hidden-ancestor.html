<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: a wide element cut by its parent</title>
    <style>
      /* The parent cuts its child at 400px. */
      html,
      body {
        margin: 0;
      }
      div {
        height: 30px;
      }
      #parent {
        width: 400px;
        overflow: hidden;
      }
      #child {
        width: 1640px;
      }
    </style>
  </head>
  <body>
    <div id="parent"><div id="child"></div></div>
  </body>
</html>
