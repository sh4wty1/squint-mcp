<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: an element moved by a transform</title>
    <style>
      /* Laid out at 0 to 200px, painted at 1400 to 1600px. */
      html,
      body {
        margin: 0;
      }
      div {
        height: 30px;
      }
      #moved {
        width: 200px;
        transform: translateX(1400px);
      }
    </style>
  </head>
  <body>
    <div id="moved"></div>
  </body>
</html>
