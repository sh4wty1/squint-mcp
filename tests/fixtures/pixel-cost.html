<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: regions that cost the most to count</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
      }
      /* 14,400,000 pixels, each of its own colour: the most a count can cost. */
      #noise {
        display: block;
      }
      /* Three glyphs of 1440x1440 over the noise. Painted only when the URL targets
         it, so that the noise can also be inspected bare. */
      #over-noise {
        position: absolute;
        top: 0;
        left: 0;
        font: 1440px/1 Ahem;
        color: rgb(0, 0, 0);
      }
      #over-noise:not(:target) {
        display: none;
      }
      /* 1,048,576 pixels, four times what is counted: red above, blue below. */
      #halves {
        position: absolute;
        top: 10000px;
        left: 0;
        width: 1024px;
        height: 1024px;
        background: linear-gradient(
          rgb(255, 0, 0) 0 512px,
          rgb(0, 0, 255) 512px 1024px
        );
      }
      /* One glyph of 600x600, more than is counted. The background-color alone
         gives 21:1; the gradient paints a light band behind its last fifth: 1.6:1. */
      #big-text {
        position: absolute;
        top: 11100px;
        left: 0;
        font: 600px/1 Ahem;
        color: rgb(255, 255, 255);
        background-color: rgb(0, 0, 0);
        background-image: linear-gradient(
          to right,
          rgb(0, 0, 0) 0 480px,
          rgb(204, 204, 204) 480px 600px
        );
      }
    </style>
  </head>
  <body>
    <canvas id="noise" width="1440" height="10000"></canvas>
    <div id="over-noise">X<br />X<br />X</div>
    <div id="halves"></div>
    <div id="big-text">X</div>
    <script>
      // Pixel i is painted in colour i, opaque: no two pixels share a colour, and
      // the page still compresses well, so capturing it stays quick.
      const context = document.getElementById("noise").getContext("2d");
      const image = context.createImageData(1440, 10000);
      const colors = new Uint32Array(image.data.buffer);
      for (let i = 0; i < colors.length; i++) colors[i] = 0xff000000 | i;
      context.putImageData(image, 0, 0);
    </script>
  </body>
</html>
