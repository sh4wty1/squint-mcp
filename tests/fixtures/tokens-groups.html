<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: values that are nearly equal</title>
    <style>
      /* Every element is a `div` and carries its styles here. A box with no text
         is 100px by 20px with the background it is named after. */
      html,
      body {
        margin: 0;
      }
      #b78-1,
      #b78-2,
      #b73-1,
      #b73-2,
      #b73-3,
      #b73-4,
      #b79,
      #b73-half,
      #g85-1,
      #g85-2,
      #g80-1,
      #g80-2 {
        width: 100px;
        height: 20px;
      }
      #b78-1,
      #b78-2 {
        background-color: #1a78e8;
      }
      #t78 {
        color: #1a78e8;
        font: 400 16px/20px Arial, sans-serif;
      }
      #b73-1,
      #b73-2,
      #b73-3,
      #b73-4 {
        background-color: #1a73e8;
      }
      #b79 {
        background-color: #1a79e8;
      }
      #b73-half {
        background-color: rgba(26, 115, 232, 0.5);
      }
      #g85-1,
      #g85-2 {
        background-color: #858585;
      }
      #g80-1,
      #g80-2 {
        background-color: #808080;
      }
    </style>
  </head>
  <body>
    <div id="b78-1"></div>
    <div id="b78-2"></div>
    <div id="t78">A text in the colour of the first two boxes</div>
    <div id="b73-1"></div>
    <div id="b73-2"></div>
    <div id="b73-3"></div>
    <div id="b73-4"></div>
    <div id="b79"></div>
    <div id="b73-half"></div>
    <div id="g85-1"></div>
    <div id="g85-2"></div>
    <div id="g80-1"></div>
    <div id="g80-2"></div>
  </body>
</html>
