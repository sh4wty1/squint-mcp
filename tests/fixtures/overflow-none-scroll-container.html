<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: a wide element in a container that scrolls</title>
    <style>
      /* The container scrolls, the page does not. */
      html,
      body {
        margin: 0;
      }
      #parent {
        width: 400px;
        overflow-x: auto;
      }
      #child {
        width: 1640px;
        height: 30px;
      }
    </style>
  </head>
  <body>
    <div id="parent"><div id="child"></div></div>
  </body>
</html>
