<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: network-idle only after a while</title>
  </head>
  <body>
    <div id="probe" style="width: 50px; height: 50px; background: rgb(0, 0, 0)"></div>
    <script>
      // Busy for `?ms=` milliseconds, then quiet: either side of the network-idle wait.
      const busyFor = Number(new URLSearchParams(location.search).get("ms"));
      const polling = setInterval(() => fetch("/tick"), 100);
      setTimeout(() => clearInterval(polling), busyFor);
    </script>
  </body>
</html>
