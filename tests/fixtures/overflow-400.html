<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: an element of 400px</title>
    <style>
      /* 1px wider than a viewport of 399px, as wide as one of 400px. */

      body {
        margin: 0;
      }
      div {
        height: 30px;
      }
      #box {
        width: 400px;
      }
    </style>
  </head>
  <body>
    <div id="box"></div>
  </body>
</html>
