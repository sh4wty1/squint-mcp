<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: covered text hit tested at every hidden pixel</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink, so 10 glyphs at 20px are a block of
         200 x 20 text pixels, 5px under the top of their 30px line: 4000 pixels. A
         cover is a box as high as the line.

         The page is the row of `#striped` of `overlap-sampled.html` alone. It holds
         1000 pixels of hidden ink, no more than the 20,000 a Capture hit tests: every
         one of them is tested, those on an odd column or an odd row of the page
         too. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        font: 20px/30px Ahem;
      }
      /* The row holds the text, which starts 40px from its left, and what is painted
         over it, placed from the left of the row. */
      .row {
        position: relative;
        margin-top: 20px;
        height: 30px;
      }
      .text {
        margin-left: 40px;
        width: 200px;
      }
      .cover {
        position: absolute;
        top: 0;
        height: 30px;
        background: rgb(200, 0, 0);
      }
      /* Stripes one pixel wide over the first 60px of the text, from 40px to 100px:
         clear on the even columns of the page and opaque on the odd ones, 41 to
         99. 30 columns of 20 rows: 600 pixels, all of them tested. */
      #stripes {
        left: 40px;
        width: 60px;
        background: repeating-linear-gradient(
          to right,
          transparent 0 1px,
          rgb(200, 0, 0) 1px 2px
        );
      }
      /* The last 20px of the text: 400 pixels. With the stripes 1000 of its 4000
         pixels are hidden: 25%, most of it by the stripes. At every second pixel
         of every second row this cover would be found at 100 and the stripes at
         none. */
      #solid-cover {
        left: 220px;
        width: 20px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div id="striped" class="text">XXXXXXXXXX</div>
      <div id="stripes" class="cover"></div>
      <div id="solid-cover" class="cover"></div>
    </div>
  </body>
</html>
