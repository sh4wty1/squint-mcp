<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: an element that ends under a pixel past the right edge of the page</title>
    <style>
      /* At 400x300 the page is 600px wide: a page scrolls by whole pixels, and
         600.4px rounds down. The element ends 0.4px after the edge. */
      html,
      body {
        margin: 0;
      }
      #fraction {
        width: 600.4px;
        height: 20px;
        background: rgb(200, 200, 200);
      }
    </style>
  </head>
  <body>
    <div id="fraction"></div>
  </body>
</html>
