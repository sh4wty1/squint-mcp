<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: a page wider than its viewport</title>
    <style>
      /* Two siblings end on the page's right edge, at 1640px. */
      html,
      body {
        margin: 0;
      }
      div {
        height: 30px;
      }
      #first,
      #second {
        width: 1640px;
      }
    </style>
  </head>
  <body>
    <div id="first"></div>
    <div id="second"></div>
  </body>
</html>
