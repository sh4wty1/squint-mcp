<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squint fixture: covered texts hit tested at every third pixel</title>
    <style>
      /* Ahem: every glyph is a 1em square of ink, so 10 glyphs at 20px are a block of
         200 x 20 text pixels, 5px under the top of their 30px line: 4000 pixels. A
         cover is a box as high as the line.

         The page holds 81,000 pixels of hidden ink: more than the 80,000 a step of
         2 takes and no more than the 180,000 a step of 3 does. Every third pixel
         of every third row is tested, counted from the corner of the page. */
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        font: 20px/30px Ahem;
      }
      /* A row holds one text, which starts 40px from its left, and what is painted
         over it, placed from the left of the row. */
      .row {
        position: relative;
        margin-top: 20px;
        height: 30px;
      }
      .text {
        margin-left: 40px;
        width: 200px;
      }
      .cover {
        position: absolute;
        top: 0;
        height: 30px;
        background: rgb(200, 0, 0);
      }
      /* Stripes one pixel wide over the first 60px of the text, from 40px to 100px:
         clear on the even columns of the page and opaque on the odd ones, 41 to
         99. 30 columns of 20 rows: 600 pixels. */
      #stripes {
        left: 40px;
        width: 60px;
        background: repeating-linear-gradient(
          to right,
          transparent 0 1px,
          rgb(200, 0, 0) 1px 2px
        );
      }
      /* The last 20px of the same text: 400 pixels. With the stripes 1000 of its
         4000 pixels are hidden: 25%.
         At every third pixel of every third row the stripes are found on the 10
         odd columns of theirs that are multiples of 3, from 45 to 99, and this
         cover on 6, from 222 to 237. At every second pixel the stripes would be
         found at none. */
      #solid-cover {
        left: 220px;
        width: 20px;
      }
      /* The last 100px of each of the texts under these two: 2000 pixels each,
         80,000 together. */
      .filler-cover {
        left: 140px;
        width: 100px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div id="striped" class="text">XXXXXXXXXX</div>
      <div id="stripes" class="cover"></div>
      <div id="solid-cover" class="cover"></div>
    </div>
    <script>
      for (let i = 0; i < 40; i++) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML =
          `<div id="filler-${i}" class="text">XXXXXXXXXX</div>` +
          `<div id="filler-cover-${i}" class="cover filler-cover"></div>`;
        document.body.append(row);
      }
    </script>
  </body>
</html>
