[project]
name = "squint-mcp"
version = "0.1.0"
description = "MCP server that finds visual bugs in a rendered web page by crossing DOM/CSS with pixels, without a baseline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Lucas Fassi" }]
keywords = ["mcp", "visual-testing", "accessibility", "playwright", "wcag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.3.0",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
]

[project.urls]
Repository = "https://github.com/sh4wty1/squint-mcp"
Issues = "https://github.com/sh4wty1/squint-mcp/issues"
Changelog = "https://github.com/sh4wty1/squint-mcp/blob/main/CHANGELOG.md"

[project.scripts]
squint-mcp = "squint_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/squint_mcp"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
